<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>ResumeFlow 简历流</title>
    <!--
      主题必须在首屏渲染前落定，否则会先画一帧白底再切暗色（闪白）。
      这里用同步内联脚本读 localStorage，没有保存过就跟随 prefers-color-scheme。
      取值逻辑与 src/composables/useTheme.ts 一致，改一处要同步另一处。
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("vitaflow-theme");
          var mode = saved === "light" || saved === "dark" ? saved : null;
          if (!mode) {
            mode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var root = document.documentElement;
          root.dataset.theme = mode;
          root.style.colorScheme = mode;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
