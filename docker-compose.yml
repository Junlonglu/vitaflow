services:
  mysql:
    image: mysql:8.0
    container_name: vitaflow-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: vitaflow
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: vitaflow-minio
    ports:
      - "9000:9000"   # API 端口
      - "9001:9001"   # 控制台端口
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vitaflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # AI 服务（pi-agent 旁路）。默认 faux 模式（确定性演示、无网络依赖）；
  # real 模式经根目录 .env 设 PI_PROVIDER=real，并从挂载的 .pi-agent/models.json
  # 读模型列表（见 ai-service/models.json.example），API Key 经 DEEPSEEK_API_KEY 注入。
  ai-service:
    build: ./ai-service
    container_name: vitaflow-ai-service
    ports:
      - "8300:8300"
    environment:
      PI_PROVIDER: ${PI_PROVIDER:-faux}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_TURN_TIMEOUT_MS: ${AI_TURN_TIMEOUT_MS:-60000}
      # 工具回调/计费回调指向宿主机 FastAPI（Windows/macOS Docker Desktop 内置该域名）
      PI_FASTAPI_BASE_URL: ${PI_FASTAPI_BASE_URL:-http://host.docker.internal:8000}
    volumes:
      # 挂载模型配置目录；faux 模式下目录可不存在（compose 会自动创建空目录）
      - ./ai-service/.pi-agent:/app/.pi-agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  mysql-data:
  minio-data:
  redis-data:
