server {
    listen 80;
    server_name _;

    # 头像/图片上传，以及 base64 图片请求的余量
    client_max_body_size 25m;

    # 后端容器重建后 IP 可能变化，用 Docker 内置 DNS 在运行时解析
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;

    # 带哈希的静态资源长缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理。AI 对话是多秒到数分钟的 NDJSON 流，必须关闭缓冲并拉长超时。
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加：$proxy_add_x_forwarded_for 会把客户端自带的 XFF 留在链首，
        # 后端取首段就拿到伪造 IP，登录限频与兑换码 IP 唯一性会被直接绕过。
        # 若前置 CDN，请在 CDN 侧收敛（或启用 ngx_http_realip_module 还原
        # $remote_addr），不要把 XFF 重新交回给客户端。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # SPA 路由回退
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
